<!doctype html>
<!-- PROTOTYPE — THROWAWAY. Three art-direction variants for the wasp scene,
     switchable via ?variant= (A|B|C) + floating bottom bar + arrow keys.
     Standalone page: NOT in deploy.yml's rsync file list, so it never ships.
     Ambient motion only — real choreography is ticket #8. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wasp art prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    font: 14px/1.4 system-ui, sans-serif; letter-spacing: .12em;
    pointer-events: none; opacity: .7;
  }
  /* switcher — deliberately NOT part of the design being judged */
  .switcher {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    background: rgba(20,20,24,.92); color: #fff; border-radius: 999px;
    padding: 8px 16px; font: 13px/1 system-ui, sans-serif;
    box-shadow: 0 4px 18px rgba(0,0,0,.5); user-select: none; z-index: 10;
  }
  .switcher button {
    all: unset; cursor: pointer; font-size: 16px; padding: 2px 6px;
  }
  .switcher button:hover { opacity: .7; }
  .switcher span { min-width: 190px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"></div>
<div class="switcher">
  <button id="prev" aria-label="previous">&#8592;</button>
  <span id="label"></span>
  <button id="next" aria-label="next">&#8594;</button>
</div>
<script>
'use strict';
// ------------------------------------------------------------ shared sim
// Ambient agents wandering around a home point. Mood only, no real choreography.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

function makeAgents(n, home) {
  const a = [];
  for (let i = 0; i < n; i++) {
    a.push({
      x: home.x + (Math.random() - .5) * 300,
      y: home.y + (Math.random() - .5) * 300,
      vx: 0, vy: 0,
      phase: Math.random() * 1000,          // noise offset
      dart: 0,                              // >0 while darting
      wing: Math.random() * Math.PI * 2,    // wing flutter phase
    });
  }
  return a;
}
function stepAgents(agents, home, t, dt, roam) {
  for (const a of agents) {
    // wander: cheap pseudo-noise via layered sines
    const n1 = Math.sin(t * .0011 + a.phase) + Math.sin(t * .0007 + a.phase * 2.1);
    const n2 = Math.cos(t * .0013 + a.phase * 1.3) + Math.sin(t * .0005 + a.phase * .7);
    a.vx += n1 * 14 * dt; a.vy += n2 * 14 * dt;
    // occasional dart
    if (a.dart <= 0 && Math.random() < .004) a.dart = .18;
    if (a.dart > 0) { a.dart -= dt; a.vx *= 1.12; a.vy *= 1.12; }
    // spring back toward roam radius around home
    const dx = a.x - home.x, dy = a.y - home.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > roam) { a.vx -= (dx / d) * 260 * dt; a.vy -= (dy / d) * 260 * dt; }
    // damp + clamp + integrate
    a.vx *= .985; a.vy *= .985;
    const sp = Math.hypot(a.vx, a.vy);
    if (sp > 30) { a.vx *= 30 / sp; a.vy *= 30 / sp; }
    a.x += a.vx * dt * 8; a.y += a.vy * dt * 8;
    a.wing += dt * 90;
  }
}

// ------------------------------------------------------------ variants
const VARIANTS = {
  A: { name: 'Night ember', n: 16,
    home() { return { x: W * .78, y: H * .72 }; },
    draw(agents, home, t) {
      ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H);
      // faint vignette stars-less dark, warm pool near nest
      let g = ctx.createRadialGradient(home.x, home.y, 10, home.x, home.y, 420);
      g.addColorStop(0, 'rgba(255,150,60,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // nest: hanging paper lantern, warm-lit layers
      ctx.save(); ctx.translate(home.x, home.y);
      ctx.strokeStyle = 'rgba(120,80,50,.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -160); ctx.lineTo(0, -92); ctx.stroke(); // stem
      for (let i = 5; i >= 0; i--) {
        const r = 26 + i * 13;
        const warm = 40 + i * 12;
        ctx.fillStyle = `rgba(${140 + warm},${70 + warm * .6},${30},${.9 - i * .1})`;
        ctx.beginPath(); ctx.ellipse(0, -r * .18, r, r * 1.15, 0, 0, Math.PI * 2); ctx.fill();
      }
      const glow = ctx.createRadialGradient(0, 46, 2, 0, 46, 26);
      glow.addColorStop(0, '#ffd9a0'); glow.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 46, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#180c04'; ctx.beginPath(); ctx.arc(0, 46, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // wasps: ember-lit streaks, additive
      ctx.globalCompositeOperation = 'lighter';
      for (const a of agents) {
        const ang = Math.atan2(a.vy, a.vx);
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang); ctx.scale(1.7, 1.7);
        ctx.fillStyle = 'rgba(255,140,50,.85)';
        ctx.beginPath(); ctx.ellipse(0, 0, 5.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,200,120,.35)';
        const w = Math.sin(a.wing) * 4;
        ctx.beginPath(); ctx.ellipse(-1, -3 - Math.abs(w) * .4, 4, 1.6, -.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-1, 3 + Math.abs(w) * .4, 4, 1.6, .5, 0, Math.PI * 2); ctx.fill();
        // trail
        ctx.strokeStyle = 'rgba(255,120,40,.22)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-16 - a.dart * 40, 0); ctx.stroke();
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
    },
    hintColor: 'rgba(255,220,180,.8)' },

  B: { name: 'Daylight naturalistic', n: 12,
    home() { return { x: W * .22, y: H * .18 }; },
    draw(agents, home, t) {
      let g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#cfe4f5'); g.addColorStop(.7, '#eae9dd'); g.addColorStop(1, '#f5efe2');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // sun glow top-right
      g = ctx.createRadialGradient(W * .9, H * .08, 10, W * .9, H * .08, 380);
      g.addColorStop(0, 'rgba(255,244,214,.9)'); g.addColorStop(1, 'rgba(255,244,214,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // eave beam
      ctx.fillStyle = '#5c5148';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * .42, 0); ctx.lineTo(W * .34, 46); ctx.lineTo(0, 62); ctx.closePath(); ctx.fill();
      // nest: grey papery ball hanging under it
      ctx.save(); ctx.translate(home.x, home.y);
      ctx.strokeStyle = '#6e6459'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, -78); ctx.lineTo(0, -48); ctx.stroke();
      for (let i = 4; i >= 0; i--) {
        const r = 34 + i * 12;
        const c = 185 - i * 14;
        ctx.fillStyle = `rgb(${c},${c - 8},${c - 22})`;
        ctx.beginPath(); ctx.ellipse(0, i * 3, r, r * 1.08, 0, 0, Math.PI * 2); ctx.fill();
      }
      // paper swirl lines
      ctx.strokeStyle = 'rgba(90,80,70,.35)'; ctx.lineWidth = 1.4;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.ellipse(0, i * 6 - 8, 30 + i * 9, 12 + i * 4, 0, .4, Math.PI - .4); ctx.stroke();
      }
      ctx.fillStyle = '#2c241d'; ctx.beginPath(); ctx.arc(0, 52, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // wasps: dark bodies, yellow banding, translucent wings
      for (const a of agents) {
        const ang = Math.atan2(a.vy, a.vx);
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang);
        const w = Math.sin(a.wing);
        ctx.fillStyle = 'rgba(160,170,190,.5)';
        ctx.beginPath(); ctx.ellipse(-1, -4 - w * 1.5, 5, 2, -.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-1, 4 + w * 1.5, 5, 2, .6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#241a10';
        ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0a72e';
        ctx.fillRect(0, -2.2, 1.6, 4.4); ctx.fillRect(3, -1.8, 1.4, 3.6);
        ctx.restore();
      }
    },
    hintColor: 'rgba(60,50,40,.75)' },

  C: { name: 'Duotone poster', n: 14,
    home() { return { x: W * .5, y: H * .48 }; },
    draw(agents, home, t) {
      ctx.fillStyle = '#f2c200'; ctx.fillRect(0, 0, W, H);
      // giant flat hex-cluster nest, centered
      ctx.save(); ctx.translate(home.x, home.y);
      const hex = (cx, cy, r) => {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 3 * i + Math.PI / 6;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
      };
      ctx.fillStyle = '#111';
      const R = Math.min(W, H) * .085;
      const offs = [[0,0],[1.75,0],[-1.75,0],[.875,1.52],[-.875,1.52],[.875,-1.52],[-.875,-1.52]];
      for (const [ox, oy] of offs) { hex(ox * R, oy * R, R * .92); ctx.fill(); }
      ctx.fillStyle = '#f2c200'; ctx.beginPath(); ctx.arc(0, 0, R * .34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, R * .22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // wasps: bold iconic silhouettes
      for (const a of agents) {
        const ang = Math.atan2(a.vy, a.vx);
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang);
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.ellipse(-5, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill();   // abdomen
        ctx.beginPath(); ctx.arc(4, 0, 3.4, 0, Math.PI * 2); ctx.fill();            // head
        const w = Math.sin(a.wing) * 3;
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-2, -3); ctx.lineTo(-8, -9 - w); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(-8, 9 + w); ctx.stroke();
        ctx.restore();
      }
    },
    hintColor: '#111' },
};

// ------------------------------------------------------------ switcher + loop
const KEYS = Object.keys(VARIANTS);
let cur = new URLSearchParams(location.search).get('variant');
if (!KEYS.includes(cur)) cur = 'A';
let agents = null, home = null;

function activate(k) {
  cur = k;
  const v = VARIANTS[k];
  home = v.home();
  agents = makeAgents(v.n, home);
  document.getElementById('label').textContent = `${k} — ${v.name}`;
  const h = document.getElementById('hint');
  h.textContent = 'wasp scene · art direction comp'; h.style.color = v.hintColor;
  const u = new URL(location); u.searchParams.set('variant', k);
  history.replaceState(null, '', u);
}
function cycle(dir) {
  activate(KEYS[(KEYS.indexOf(cur) + dir + KEYS.length) % KEYS.length]);
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
addEventListener('resize', () => activate(cur));

let prev = null;
function loop(t) {
  const dt = prev == null ? .016 : Math.min((t - prev) / 1000, .05);
  prev = t;
  stepAgents(agents, home, t, dt, Math.min(W, H) * .38);
  VARIANTS[cur].draw(agents, home, t);
  requestAnimationFrame(loop);
}
activate(cur);
requestAnimationFrame(loop);
</script>
</body>
</html>
