<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII aquarium</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05080b;
        color: #d7e2ea;
        font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
      }

      body {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100%;
      }

      #controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin: 0;
        padding: 22px 18px;
        background: #0b1218;
        border-right: 1px solid #1c2a33;
        overflow: auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      label {
        display: grid;
        gap: 6px;
        color: #9eb0bc;
        font-size: 13px;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      output {
        min-width: 2.5ch;
        color: #d7e2ea;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      select,
      input[type="range"] {
        width: 100%;
        accent-color: #d7b56a;
      }

      select {
        padding: 6px 8px;
        color: #d7e2ea;
        background: #101920;
        border: 1px solid #2a3c48;
        border-radius: 4px;
      }

      .hint,
      #status {
        margin: 0;
      }

      .hint {
        color: #8ea0ad;
        font-size: 13px;
      }

      #status {
        min-height: 1.4em;
        color: #e7c07a;
      }

      #save {
        margin-top: auto;
        padding: 8px 12px;
        color: #1a1408;
        background: #f4e2a4;
        border: 0;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }

      #save:hover {
        background: #ffe7b0;
      }

      #ocean {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        background: #000;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        cursor: crosshair;
        touch-action: manipulation;
      }

      @media (max-width: 719px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(60vh, 1fr);
          height: auto;
        }

        #controls {
          border-right: 0;
          border-bottom: 1px solid #1c2a33;
        }

        #save {
          margin-top: 0;
        }

        #ocean {
          min-height: 60vh;
          height: 60vh;
        }
      }
    </style>
  </head>
  <body>
    <form id="controls">
      <h1>ASCII aquarium</h1>
      <label>
        Species
        <select name="kind"></select>
      </label>
      <label>
        Size
        <span class="row">
          <input type="range" name="size" />
          <output data-for="size"></output>
        </span>
      </label>
      <label>
        Sharks
        <span class="row">
          <input type="range" name="sharkCount" />
          <output data-for="sharkCount"></output>
        </span>
      </label>
      <label>
        Fish
        <span class="row">
          <input type="range" name="fishCount" />
          <output data-for="fishCount"></output>
        </span>
      </label>
      <label>
        Palette
        <select name="palette"></select>
      </label>
      <p class="hint">Click the water to drop food.</p>
      <p id="status" role="status"></p>
      <button type="button" id="save">Save PNG</button>
    </form>
    <canvas id="ocean" aria-label="Aquarium"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
